<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KNHS Chatbot</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="KNHS-Logo-1.png" alt="KNHS Logo" class="logo">
      <h1>KALAYAAN NATIONAL HIGH SCHOOL - PASAY CITY</h1>
    </div>
    <p class="subtitle">Chat with KNHSian AI Assistant</p>
  </header>
  
  <div class="chat-container">
    <div class="chat-history" id="chat-messages">
    </div>
    
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
      <button id="send-button">Send</button>
    </div>
  </div>
  
  <footer>
    © 2025 Kalayaan National High School - Pasay City
  </footer>
  <script src="script.js"></script>
</body>
</html>
